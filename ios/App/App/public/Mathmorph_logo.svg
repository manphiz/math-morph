<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#021324" />
      <stop offset="100%" stop-color="#03060c" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38f8ff" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feGaussianBlur stdDeviation="30" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="squircleClip">
      <rect x="16" y="16" width="480" height="480" rx="104" ry="104" />
    </clipPath>
  </defs>

  <!-- Background App Icon Frame -->
  <g clip-path="url(#squircleClip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#bgGlow)" />
    
    <!-- Grid Pattern -->
    <g stroke="rgba(0, 180, 255, 0.08)" stroke-width="1.2">
      <!-- Vertical Grid Lines -->
      <line x1="64" y1="16" x2="64" y2="496" />
      <line x1="112" y1="16" x2="112" y2="496" />
      <line x1="160" y1="16" x2="160" y2="496" />
      <line x1="208" y1="16" x2="208" y2="496" />
      <line x1="304" y1="16" x2="304" y2="496" />
      <line x1="352" y1="16" x2="352" y2="496" />
      <line x1="400" y1="16" x2="400" y2="496" />
      <line x1="448" y1="16" x2="448" y2="496" />
      
      <!-- Horizontal Grid Lines -->
      <line x1="16" y1="64" x2="496" y2="64" />
      <line x1="16" y1="112" x2="496" y2="112" />
      <line x1="16" y1="160" x2="496" y2="160" />
      <line x1="16" y1="208" x2="496" y2="208" />
      <line x1="16" y1="304" x2="496" y2="304" />
      <line x1="16" y1="352" x2="496" y2="352" />
      <line x1="16" y1="400" x2="496" y2="400" />
      <line x1="16" y1="448" x2="496" y2="448" />
    </g>

    <!-- Center Coordinate Axes -->
    <line x1="256" y1="16" x2="256" y2="496" stroke="rgba(0, 210, 255, 0.3)" stroke-width="2" />
    <line x1="16" y1="256" x2="496" y2="256" stroke="rgba(0, 210, 255, 0.3)" stroke-width="2" />

    <!-- Concentric Nested Morphing Hearts (Back-to-Front Depth Tunnel) -->
    <!-- Heart 6 (Deepest / Smallest) -->
    <path d="M 256 168 C 285 130 338 140 348 184 C 358 226 312 280 256 322 C 200 280 154 226 164 184 C 174 140 227 130 256 168 Z"
          fill="none" stroke="#0077ff" stroke-width="3" stroke-opacity="0.35" />

    <!-- Heart 5 -->
    <path d="M 256 162 C 293 120 354 130 366 182 C 378 234 326 298 256 348 C 186 298 134 234 146 182 C 158 130 219 120 256 162 Z"
          fill="none" stroke="#0099ff" stroke-width="3.5" stroke-opacity="0.45" />

    <!-- Heart 4 -->
    <path d="M 256 156 C 302 110 372 120 385 180 C 398 244 340 316 256 372 C 172 316 114 244 127 180 C 140 120 210 110 256 156 Z"
          fill="none" stroke="#00b4ff" stroke-width="4" stroke-opacity="0.6" />

    <!-- Heart 3 -->
    <path d="M 256 150 C 312 100 390 110 405 178 C 420 254 354 336 256 398 C 158 336 92 254 107 178 C 122 110 200 100 256 150 Z"
          fill="none" stroke="#00d2ff" stroke-width="4.5" stroke-opacity="0.75" />

    <!-- Heart 2 -->
    <path d="M 256 144 C 322 90 408 100 425 176 C 442 264 368 356 256 422 C 144 356 70 264 87 176 C 104 100 190 90 256 144 Z"
          fill="none" stroke="#22e1ff" stroke-width="5" stroke-opacity="0.88" filter="url(#softGlow)" />

    <!-- Heart 1 (Outermost Main Glowing Heart) -->
    <path d="M 256 142 C 328 84 416 95 434 174 C 452 268 376 364 256 434 C 136 364 60 268 78 174 C 96 95 184 84 256 142 Z"
          fill="none" stroke="url(#neonCyan)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#outerGlow)" />

    <!-- Inner Core Brightness on Outermost Heart -->
    <path d="M 256 142 C 328 84 416 95 434 174 C 452 268 376 364 256 434 C 136 364 60 268 78 174 C 96 95 184 84 256 142 Z"
          fill="none" stroke="#e0fbff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Squircle Border Outline -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="none" stroke="rgba(0, 209, 255, 0.2)" stroke-width="2" />
</svg>
